<!doctype html>
<html lang="es">
<head>

<link rel="canonical" href="https://tapas.marcogugliandolo.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="Que Tapa! · Las tapas de Lugo, hoy">

<meta property="og:url" content="https://tapas.marcogugliandolo.com/">

<script>try { var l = localStorage.getItem('quetapa-lingua'); if (l === 'gl' || (!l && /^gl\b/i.test(navigator.language || ''))) document.documentElement.lang = 'gl'; var th = localStorage.getItem('quetapa-tema'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}</script>
</head>
<body data-view="home">
<div id="map" data-t-label="Mapa de Lugo con las tapas de hoy" aria-label="Mapa de Lugo con las tapas de hoy"></div>
<p id="nomap" hidden data-t="Tu navegador no puede dibujar el mapa. Las tapas y los bares funcionan igual.">Tu navegador no puede dibujar el mapa. Las tapas y los bares funcionan igual.</p>
<div id="aim" hidden aria-hidden="true"><span></span></div>

<aside class="side">
  <a class="brand" href="./"><img src="icon.svg" width="30" height="30" alt=""><span>Que Tapa!</span></a>
  <div class="top">
    <label class="search" for="q">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span class="sr" data-t="Buscar un bar o una tapa">Buscar un bar o una tapa</span>
      <input id="q" type="search" placeholder="Busca un bar" data-t-placeholder="Busca un bar" autocomplete="off" enterkeyhint="search">
    </label>
    <button type="button" id="upload-btn" class="round menu-btn brand-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5h3l1.8-2.5h6.4L17 8.5h3V19H4z"></path><circle cx="12" cy="13.2" r="3.4"></circle></svg>
      <span data-t="Subir">Subir</span>
    </button>
    <button type="button" id="theme" class="round"></button>
  </div>
  <section id="sheet" data-size="mid" data-t-label="Información" aria-label="Información">
    <button type="button" id="grab" data-t-label="Cambiar el tamaño del panel" aria-label="Cambiar el tamaño del panel"><span></span></button>
    <div id="sheet-body"></div>
  </section>
</aside>

<button type="button" id="locate" class="round" data-t-label="Ver los bares cerca de mí" aria-label="Ver los bares cerca de mí">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 3 10.5l7.5 3 3 7.5z"></path></svg>
</button>
<div class="zoom">
  <button type="button" id="zoom-in" data-t-label="Acercar" aria-label="Acercar">+</button>
  <button type="button" id="zoom-out" data-t-label="Alejar" aria-label="Alejar">−</button>
</div>
<button type="button" id="credit" data-t-label="Créditos del mapa" aria-label="Créditos del mapa">i</button>
<div id="toast" role="status" hidden></div>
<input id="file-camera" type="file" accept="image/*" capture="environment" hidden>
<input id="file-gallery" type="file" accept="image/*" hidden>

<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>

</html>
