# Que Tapa!: sirve la web estática en el puerto 3000 del contenedor y pasa /api/ al servicio tapas-api.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin registro de visitas (la IP de cada petición): no hace falta para servir la web.
    access_log off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Subir una tapa: la foto ya llega reducida desde el móvil (unos 300 KB), pero se deja margen.
    location = /api/tapas {
        resolver 127.0.0.11 valid=10s;
        set $api http://tapas-api:3001;
        proxy_pass $api;
        proxy_set_header X-Real-IP $http_x_real_ip;
        client_max_body_size 3m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # El logo del bar, desde su panel (una foto pequeña ya reducida en el móvil).
    location = /api/logo {
        resolver 127.0.0.11 valid=10s;
        set $api http://tapas-api:3001;
        proxy_pass $api;
        proxy_set_header X-Real-IP $http_x_real_ip;
        client_max_body_size 512k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Enlaces para compartir: la API pone la foto de la tapa para la vista previa de WhatsApp.
    location /compartir/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://tapas-api:3001;
        proxy_pass $api;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 1k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # El resto de la API: el servicio se busca al usarlo, así nginx arranca aunque no esté.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://tapas-api:3001;
        proxy_pass $api;
        proxy_set_header X-Real-IP $http_x_real_ip;
        client_max_body_size 16k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /privacidad { return 301 /privacidad/; }
    location = /privacidade { return 301 /privacidade/; }

    location ~ ^/(privacidad|privacidade)/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }

    location /vendor/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }

    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg;
        font/woff2 woff2;
        text/plain txt;
        application/xml xml;
    }
}
