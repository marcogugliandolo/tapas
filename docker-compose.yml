# Que Tapa! · las tapas de Lugo, hoy
# Stack para Portainer: pega este fichero en Stacks > Add stack > Web editor.
#
# Al arrancar, cada contenedor descarga la rama indicada del repositorio de GitHub.
# Para actualizar: haz push a GitHub y reinicia los dos contenedores (tapas y tapas-api).
# Si GitHub no responde al reiniciar, la web sigue sirviendo la última copia descargada.
#
# Va dentro de la red de Nginx Proxy Manager y publica el puerto 3092.
# En NPM: tapas.marcogugliandolo.com -> http://tapas:3000 (con https: la cámara y la ubicación lo necesitan)
#
# tapas-api guarda todo en el volumen tapas-datos: bares dados de alta, tapas, fotos, mensajes y
# la lista de bares de OpenStreetMap. La página de moderación sale en sus registros al arrancar:
#   Portainer > Containers > tapas-api > Logs, línea [admin]
#
# Variables opcionales (Portainer > Environment variables):
#   TAPAS_PORT    puerto del servidor (por defecto 3092)
#   TAPAS_REPO    usuario/repositorio (por defecto marcogugliandolo/tapas)
#   TAPAS_BRANCH  rama (por defecto main)
#   GITHUB_TOKEN  solo si el repositorio es privado (token con permiso de lectura)
#   PUBLIC_URL    la dirección pública, para los enlaces de los bares (por defecto https://tapas.marcogugliandolo.com)
#   ADMIN_CLAVE   otra clave para la moderación (si no se pone, se crea sola la primera vez)
#   NTFY_URL      aviso al móvil (app ntfy) con cada foto por revisar, bar nuevo o mensaje,
#                 por ejemplo https://ntfy.sh/un-nombre-largo-que-solo-sepas-tu
#   OSM           0 para no descargar los bares de OpenStreetMap
#   OVERPASS_URL  otro servidor de Overpass

services:
  tapas:
    image: nginx:1.27-alpine
    container_name: tapas
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 5s
    ports:
      - "${TAPAS_PORT:-3092}:3000"
    networks:
      - npm
      - interno
    environment:
      REPO: ${TAPAS_REPO:-marcogugliandolo/tapas}
      BRANCH: ${TAPAS_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TZ: Europe/Madrid
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        WEB=/usr/share/nginx/html
        TMP=/tmp/tapas
        rm -rf "$$TMP" && mkdir -p "$$TMP"

        fetch() {
          if [ -n "$$GITHUB_TOKEN" ]; then
            wget -q -T 30 --header "Authorization: Bearer $$GITHUB_TOKEN" \
              -O "$$TMP/src.tgz" "https://api.github.com/repos/$$REPO/tarball/$$BRANCH"
          else
            wget -q -T 30 -O "$$TMP/src.tgz" \
              "https://codeload.github.com/$$REPO/tar.gz/refs/heads/$$BRANCH"
          fi
        }

        if fetch && tar -xzf "$$TMP/src.tgz" -C "$$TMP"; then
          SRC=$$(find "$$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -f "$$SRC/app/index.html" ] && [ -f "$$SRC/nginx.conf" ]; then
            rm -rf "$$WEB"/* "$$WEB"/.tapas-version
            cp -r "$$SRC/app/." "$$WEB/"
            cp "$$SRC/nginx.conf" /etc/nginx/conf.d/default.conf
            date '+%Y-%m-%d %H:%M:%S' > "$$WEB/.tapas-version"
            echo "[tapas] desplegado $$REPO@$$BRANCH"
          else
            echo "[tapas] el repositorio no tiene app/index.html o nginx.conf"
          fi
        else
          echo "[tapas] no se pudo descargar $$REPO@$$BRANCH"
        fi
        rm -rf "$$TMP"

        if [ ! -f "$$WEB/.tapas-version" ]; then
          echo "[tapas] no hay ninguna copia que servir; reintento en 15 s"
          sleep 15
          exit 1
        fi

        nginx -t && exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  tapas-api:
    image: node:22-alpine
    container_name: tapas-api
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 5s
    init: true
    networks:
      - interno
    volumes:
      - tapas-datos:/data
    environment:
      REPO: ${TAPAS_REPO:-marcogugliandolo/tapas}
      BRANCH: ${TAPAS_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-https://tapas.marcogugliandolo.com}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-}
      NTFY_URL: ${NTFY_URL:-}
      OSM: ${OSM:-1}
      OVERPASS_URL: ${OVERPASS_URL:-}
      TZ: Europe/Madrid
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        APP=/srv/api
        TMP=/tmp/tapas
        rm -rf "$$TMP" && mkdir -p "$$TMP" "$$APP"

        fetch() {
          if [ -n "$$GITHUB_TOKEN" ]; then
            wget -q -T 30 --header "Authorization: Bearer $$GITHUB_TOKEN" \
              -O "$$TMP/src.tgz" "https://api.github.com/repos/$$REPO/tarball/$$BRANCH"
          else
            wget -q -T 30 -O "$$TMP/src.tgz" \
              "https://codeload.github.com/$$REPO/tar.gz/refs/heads/$$BRANCH"
          fi
        }

        if fetch && tar -xzf "$$TMP/src.tgz" -C "$$TMP"; then
          SRC=$$(find "$$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -f "$$SRC/server/api.mjs" ]; then
            rm -rf "$$APP"/* && cp -r "$$SRC/server/." "$$APP/"
          fi
        fi
        rm -rf "$$TMP"
        cd "$$APP" || exit 1
        if [ ! -f api.mjs ]; then
          echo "[api] no hay copia del servicio; reintento en 15 s"
          sleep 15
          exit 1
        fi
        # Sin dependencias: solo Node.
        exec node api.mjs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  npm:
    external: true
    name: npm-master_default
  interno:

volumes:
  tapas-datos:
